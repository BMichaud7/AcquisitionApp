name: RPM Package

on:
  push:
    branches: ["main/1.0"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    container:
      image: rockylinux:9

    steps:
      - name: Install build tools
        run: |
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf makecache
          dnf install -y cmake ninja-build gcc-c++ git pkg-config ruby ruby-devel rpm-build
          gem install --no-document fpm
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf install -y gh --repo gh-cli

      - name: Install app dependencies
        run: dnf install -y qpid-proton-cpp-devel tinyxml2-devel fftw-devel spdlog-devel fmt-devel postgresql-devel

      - uses: actions/checkout@v4

      - name: Clone sibling dependencies
        run: |
          git clone --depth 1 --branch main/1.0 https://github.com/OpenRFStack/SdrSdk.git ../SdrSdk
          git clone --depth 1 --branch main/1.0 https://github.com/OpenRFStack/SdrTaskApi.git ../SdrTaskApi

      - name: Build libpqxx from source
        run: |
          git clone --depth 1 --branch 7.9.0 https://github.com/jtv/libpqxx.git /tmp/libpqxx
          # Patch cmake config that calls internal cmake_determine_compile_features
          # (removed in cmake 3.28, which Rocky 9 ships)
          sed -i '/CMakeDetermineCompileFeatures/d; /cmake_determine_compile_features/d' /tmp/libpqxx/cmake/config.cmake
          # Pin a portable baseline on arm64: the GitHub-hosted aarch64 runner
          # supports ARMv8.1+ LSE atomics, which SIGILL on Cortex-A72 deploy
          # targets (e.g. Raspberry Pi 4) if the default target arch includes them.
          EXTRA_CXXFLAGS=""
          [ "$(uname -m)" = "aarch64" ] && EXTRA_CXXFLAGS="-march=armv8-a"
          cmake -B /tmp/libpqxx-build -S /tmp/libpqxx \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF \
            -DCMAKE_CXX_FLAGS="${EXTRA_CXXFLAGS}"
          cmake --build /tmp/libpqxx-build --parallel
          cmake --install /tmp/libpqxx-build

      - name: Build
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=OFF
          cmake --build build --parallel
          DESTDIR=$PWD/install cmake --install build

      - name: Package RPM with fpm
        run: |
          VERSION=$(grep -oP 'project\(sdr_acquisition.*VERSION\s+\K\d+\.\d+\.\d+' CMakeLists.txt | head -1 || echo "1.5.0")
          BIN=$(find install -name "sdr_acquisition" -type f | head -1)
          [ -z "$BIN" ] && BIN=$(find build -name "sdr_acquisition" -type f | head -1)
          if [ -z "$BIN" ]; then
            echo "ERROR: sdr_acquisition not found after build"
            find install/ build/ -name "sdr_*" 2>/dev/null | head -20
            exit 1
          fi
          echo "Found binary: $BIN"
          mkdir -p rpm_out
          PQXX_LIBS=$(find /usr/lib64 /usr/local/lib64 /usr/lib /usr/local/lib -name 'libpqxx*.so*' ! -name '*.a' 2>/dev/null)
          PQXX_ARGS=(); for lib in $PQXX_LIBS; do PQXX_ARGS+=("${lib}=/usr/lib64/$(basename ${lib})"); done
          fpm -s dir -t rpm \
            -n sdr-acquisition \
            -v "${VERSION}" \
            --iteration 1 \
            --rpm-os linux \
            --description "OpenRFStack sdr-acquisition" \
            --url "https://github.com/OpenRFStack/AcquisitionApp" \
            --license "Proprietary" \
            --package rpm_out/ \
            "${BIN}=/usr/bin/sdr_acquisition" \
            "${PQXX_ARGS[@]}"
          ls -lh rpm_out/

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=latest-main
          gh release view "$TAG" --repo ${{ github.repository }} 2>/dev/null || \
            gh release create "$TAG" \
              --repo ${{ github.repository }} \
              --title "Latest build" \
              --notes "Rolling pre-release from main/1.0" \
              --prerelease
          gh release upload "$TAG" rpm_out/*.rpm \
            --repo ${{ github.repository }} \
            --clobber
